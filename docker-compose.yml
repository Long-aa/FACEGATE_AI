version: '3.8'

services:
  # ── 1. Frontend Web App (Next.js 16 / React 19 / Tailwind v4) ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facegate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:8001
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - facegate-network

  # ── 2. Backend REST API & Virtual Door Machine (FastAPI / Python 3.11) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facegate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://facegate:facegate@postgres:5432/facegate
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - DEBUG=False
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - INTERNAL_SERVICE_KEY=facegate-internal-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - facegate-network

  # ── 3. AI Service (InsightFace + ONNX Runtime + MiniFASNet Anti-Spoofing) ─
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: facegate-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - DEBUG=False
    volumes:
      - ./ai-service/models:/app/models
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - facegate-network

  # ── 4. PostgreSQL Database with pgvector (HNSW Indexing) ─────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facegate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=facegate
      - POSTGRES_PASSWORD=facegate
      - POSTGRES_DB=facegate
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/database:ro
      - ./infrastructure/postgres/init/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facegate -d facegate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facegate-network

  # ── 5. Redis In-Memory Cache ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: facegate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - facegate-network

volumes:
  postgres-data:
    name: facegate-postgres-data
  redis-data:
    name: facegate-redis-data

networks:
  facegate-network:
    name: facegate-network
    driver: bridge
